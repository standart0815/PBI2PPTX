[project]
name = "pbi2pptx"
version = "0.1.0"
description = "Turns a user's choice of Power BI report pages into one PowerPoint deck built from their own template."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jens Herrmann" }]
keywords = ["power-bi", "powerpoint", "pptx", "reporting", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=11",
    "playwright>=1.50",
    "pystray>=0.19",
    "python-pptx>=1.0.2",
    "starlette>=0.40",
    "uvicorn>=0.32",
]

[project.scripts]
pbi2pptx = "pbi2pptx.app:main"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pyinstaller>=6.10",
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.27"]  # 1.27 reads the SPDX license fields
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbi2pptx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
