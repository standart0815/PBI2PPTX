[project]
name = "pbi2pptx"
version = "0.1.0"
description = "Turns a user's choice of Power BI report pages into one PowerPoint deck built from their own template."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=11",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbi2pptx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
