name: Release build

# Builds the installers. Run it by hand (Actions → Release build → Run workflow), or push a tag
# such as v0.1.0. The installers are attached to the run as artifacts; with a tag they also go
# onto a draft GitHub release. They are not code-signed yet.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: ./packaging/build_macos.sh

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: PBI2PPTX-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*-Setup.exe
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create a draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" installers/* --repo "${GITHUB_REPOSITORY}" --draft --title "PBI2PPTX ${GITHUB_REF_NAME#v}" --notes "Unsigned build. See docs/GETTING-STARTED.md for how to open it."
