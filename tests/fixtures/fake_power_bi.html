<!doctype html>
<!--
  A fake of the Power BI web interface for offline tests of the Power BI Window.
  Served for every https://app.powerbi.com/ document by Playwright routing (tests/test_power_bi_window.py).
  Mirrors the selectors and texts in pbi2pptx/power_bi_ui.py, as observed in Power BI on 2026-10-19.

  Test switches (localStorage):
    fake-changed      "1": the User has personal changes, so "Reset to default" is enabled
    fake-actual-size  "1": the canvas is not in fit-to-page view
    fake-no-pane      "1": the report hides its filter pane (no toggle button)
    fake-date-time    "1": date cards show a midnight time, as a column that stores times may ("ist vor 01.01.2014 00:00:00")
    fake-pane-filters JSON [{table, column, condition, ticked?}]: filters the User set in the Filter Pane
    fake-slicers      JSON [{column, kind: list|dropdown|range|other, items?: [[value, checked]], selectAll?, text?, scrollable?,
                            available?: [first, last], selected?: [first, last]}]
                      A range with available/selected is a date slicer, with the aria-labels Power BI writes.

  URL filters (?filter=…) apply only to known fields (financials/Country, financials/Segment,
  Calendar/Date); others are silently ignored, as in Power BI. Applied ones show as filter pane
  cards, in the browser's language: "ist Germany oder France", and one card per date condition,
  "ist am oder nach 01.06.2013" / "ist vor 01.01.2014" ("is on or after 6/1/2013", "is before 1/1/2014").
-->
<html>
<head>
<meta charset="utf-8">
<title>Power BI</title>
<style>
  body { margin: 0; font: 14px sans-serif; background: #f3f2f1; }
  .header { position: absolute; left: 0; top: 0; right: 0; height: 0; overflow: hidden; }
  .ribbon { position: absolute; left: 0; top: 0; right: 0; height: 90px; background: #fff; }
  .ribbon [role=tab] { display: inline-block; padding: 8px 14px; }
  .ribbon button { margin: 4px; }
  .nav { position: absolute; left: 0; top: 100px; width: 260px; background: #fff; }
  .nav [role=tab], .nav .itemRow { padding: 8px; }
  .displayArea { position: absolute; left: 300px; top: 150px; width: 1280px; height: 720px; background: #ffffff; overflow: hidden; }
  .displayArea h1 { margin: 20px; font-size: 48px; color: #222; }
  .bar { position: absolute; left: 20px; top: 300px; height: 120px; background: #2f5597; }
  .personal { position: absolute; left: 20px; top: 500px; width: 400px; height: 80px; background: #ffc000; }
  .optionsMenu { position: absolute; right: 20px; top: 20px; width: 160px; height: 40px; background: #ff0000; }
  .tutorial-popup { position: absolute; left: 600px; top: 250px; width: 400px; height: 220px; background: #0f6b5c; color: #fff; }
  filter-pane-modern { position: absolute; right: 0; top: 100px; width: 260px; background: #fff; }
  [role=dialog] { position: absolute; left: 500px; top: 400px; width: 500px; height: 160px; background: #fff; border: 2px solid #333; }
</style>
</head>
<body>
<script>
const REPORT = "11111111-0000-0000-0000-000000000001";
const PAGES = [
  { id: "aaaa0000000000000001", name: "Umsatz" },
  { id: "aaaa0000000000000002", name: "Regionen" },
];
const path = location.pathname;
const query = new URLSearchParams(location.search);
const store = { get: k => localStorage.getItem(k) === "1", set: (k, v) => v ? localStorage.setItem(k, "1") : localStorage.removeItem(k) };
const json = (k) => { try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch { return []; } };

function el(tag, attrs = {}, text = "") {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text) e.textContent = text;
  return e;
}

const KNOWN_FIELDS = { financials: ["Country", "Segment"], Calendar: ["Date"] };
const EN = navigator.language.startsWith("en");

function parseFilters(expression) {
  if (!expression) return [];
  const unescape = (s) => s.replace(/_x([0-9A-F]{4})_/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
  return expression.split(" and ").map((part) => {
    const d = part.match(/^(\w+)\/(\w+) (ge|gt|le|lt) (\d{4})-(\d{2})-(\d{2})$/);
    if (d) return { table: unescape(d[1]), column: unescape(d[2]), operator: d[3], date: [+d[4], +d[5], +d[6]] };
    const m = part.match(/^(\w+)\/(\w+) (eq|in) (.+)$/);
    if (!m) return null;
    const raw = m[3] === "eq" ? [m[4]] : m[4].replace(/^\(|\)$/g, "").split(",");
    const values = raw.map((v) => v.trim().replace(/^'|'$/g, "").replace(/''/g, "'"));
    return { table: unescape(m[1]), column: unescape(m[2]), values };
  }).filter(Boolean);
}

// How Power BI writes a condition in a card, in the interface language.
function restatement(f) {
  if (f.values) return (EN ? "is " : "ist ") + f.values.join(EN ? " or " : " oder ");
  const [y, m, d] = f.date;
  const shown = EN ? `${m}/${d}/${y}` : `${String(d).padStart(2, "0")}.${String(m).padStart(2, "0")}.${y}`;
  const words = EN
    ? { ge: "is on or after", gt: "is after", le: "is on or before", lt: "is before" }
    : { ge: "ist am oder nach", gt: "ist nach", le: "ist am oder vor", lt: "ist vor" };
  const time = store.get("fake-date-time") ? (EN ? " 12:00:00 AM" : " 00:00:00") : "";
  return `${words[f.operator]} ${shown}${time}`;
}

// Power BI applies only filters on fields that exist, and says nothing about the others.
const appliedFilters = parseFilters(query.get("filter")).filter((f) => (KNOWN_FIELDS[f.table] || []).includes(f.column));
let paneOpen = false;

// A Filter Pane card: the field label `"table"[column]` and the condition, both in title attributes.
function card(table, column, condition, ticked) {
  const box = el("div", { class: "filterCard" });
  const title = el("div", { class: "filterCardTitleSection" });
  const field = EN ? `'${table}'[${column}]` : `"${table}"[${column}]`;
  title.append(el("span", { "data-testid": "filter-card-title", title: field }, column), " ",
               el("span", { "data-testid": "filter-card-restatement", title: condition }, condition));
  box.append(title);
  if (ticked) {  // a shortened condition: clicking the card shows every ticked value
    title.onclick = () => {
      const open = box.querySelector(".items");
      if (open) { open.remove(); return; }
      const items = el("div", { class: "items" });
      items.append(el("div", { "aria-checked": "mixed", title: "Alle auswählen" }, "Alle auswählen"));
      for (const v of ticked) items.append(el("div", { "aria-checked": "true", title: v }, v));
      items.append(el("div", { "aria-checked": "false", title: "Canada" }, "Canada"));
      box.append(items);
    };
  }
  return box;
}

function toggleFilterPane() {
  paneOpen = !paneOpen;
  const old = document.querySelector("filter-pane-modern");
  if (old) old.remove();
  if (paneOpen) {
    const pane = el("filter-pane-modern");
    const all = EN ? "is (All)" : "ist (alle)";
    pane.append(card("financials", "Product", all), card("financials", "Discount Band", all), card("Calendar", "Date", all));
    for (const f of appliedFilters) pane.append(card(f.table, f.column, restatement(f)));
    for (const f of json("fake-pane-filters")) pane.append(card(f.table, f.column, f.condition, f.ticked));
    document.body.append(pane);
  }
  const canvas = document.querySelector(".displayArea");
  if (canvas) canvas.style.width = paneOpen ? "1000px" : "1280px";  // the open pane narrows the canvas
}

// A slicer visual: a header, then ticked list items, a dropdown, or the two handles of a range.
function slicer(s) {
  const container = el("div", { class: "visualContainer" });
  const visual = el("div", { class: "visual visual-slicer" });
  visual.append(el("div", { class: "slicer-header-wrapper" }, s.column));
  if (s.kind === "range") {
    if (s.available) {
      const [first, last] = s.available;
      const ends = EN ? [["Start date", s.selected[0]], ["End date", s.selected[1]]] : [["Startdatum", s.selected[0]], ["Enddatum", s.selected[1]]];
      for (const [end, chosen] of ends) {
        visual.append(el("div", { "aria-label": EN ? `${end}. Available input range ${first} to ${last}` : `${end}. Verfügbarer Eingabebereich ${first} für ${last}` }));
        visual.append(el("button", { "aria-label": EN ? `${end}, calendar button, selected: ${chosen}, choose date` : `${end}, Kalenderschaltfläche, ausgewählt: ${chosen}, Datum auswählen` }, chosen));
      }
    }
    visual.append(el("div", { "data-handle": "0" }), el("div", { "data-handle": "1" }));
  } else if (s.kind === "other") {
    visual.append(el("input", { type: "number", value: "3" }));  // e.g. a relative date slicer: "last 3 months"
  } else if (s.kind === "dropdown") {
    visual.append(el("div", { "data-testid": "slicer-dropdown" }, s.text || "Alle"));
  } else {
    const list = el("div", { class: "visibleGroup" });
    if (s.scrollable) { list.style.height = "20px"; list.style.overflow = "auto"; }
    if (s.selectAll) list.append(el("div", { class: "slicerItemContainer", "aria-checked": s.selectAll, title: "Alle auswählen" }, "Alle auswählen"));
    for (const [value, checked] of s.items || []) list.append(el("div", { class: "slicerItemContainer", "aria-checked": String(checked), title: value }, value));
    visual.append(list);
  }
  container.append(visual);
  return container;
}

function renderCanvas(page) {
  const old = document.querySelector(".displayArea");
  if (old) old.remove();
  const canvas = el("div", { class: "displayArea disableAnimations" + (store.get("fake-actual-size") ? "" : " fitToPage") });
  canvas.style.width = paneOpen ? "1000px" : "1280px";
  canvas.append(el("h1", {}, page.name));
  const bar = el("div", { class: "bar" });
  bar.style.width = appliedFilters.length ? "300px" : "1100px";
  canvas.append(bar);
  if (appliedFilters.length) canvas.append(el("p", { class: "filter" }, "Filter: " + appliedFilters.map(restatement).join(", ")));
  if (store.get("fake-changed")) canvas.append(el("div", { class: "personal" }));
  for (const s of json("fake-slicers")) canvas.append(slicer(s));
  canvas.append(el("div", { class: "optionsMenu" }));  // a visual's hover toolbar
  document.body.append(canvas);
}

function renderReport(m) {
  const [, workspace, app, report, pageId] = m;
  if (report.startsWith("00000000")) { location.replace("/home"); return; }
  const page = PAGES.find(p => p.id === pageId) || PAGES[0];
  // Workspace titles name the page first; App titles only the report.
  document.title = app ? "Beispielbericht – Power BI" : `${page.name} - Beispielbericht – Power BI`;
  const header = el("div", { class: "header" });
  header.append(el("button", { class: "info-bar", "aria-label": "Beispielbericht" }, "Beispielbericht"));
  document.body.append(header);

  // Ribbon: its tabs are role=tab too, and "Start" is selected.
  const ribbon = el("div", { class: "ribbon" });
  const tabs = el("div", { role: "tablist", "aria-label": "Registerkarten des Menübands" });
  tabs.append(el("div", { role: "tab", "aria-selected": "true" }, "Start"));
  const view = el("div", { role: "tab", "aria-selected": "false" }, "Anzeigen");
  view.onclick = () => {
    const fit = el("button", {}, "An Seite anpassen");
    fit.onclick = () => { store.set("fake-actual-size", false); renderCanvas(page); fit.remove(); };
    ribbon.append(fit);
  };
  tabs.append(view);
  ribbon.append(tabs);
  const reset = el("button", {}, "Auf Standardwert zurücksetzen");
  reset.disabled = !store.get("fake-changed");
  reset.onclick = () => {
    const dialog = el("div", { role: "dialog" });
    dialog.append(el("p", {}, "Möchten Sie Filter, Slicer und weitere Änderungen zurücksetzen?"));
    const ok = el("button", {}, "Zurücksetzen");
    ok.onclick = () => { store.set("fake-changed", false); reset.disabled = true; dialog.remove(); renderCanvas(page); };
    const cancel = el("button", {}, "Abbrechen");
    cancel.onclick = () => dialog.remove();
    dialog.append(ok, cancel);
    document.body.append(dialog);
  };
  ribbon.append(reset);
  if (!store.get("fake-no-pane")) {
    const toggle = el("button", { class: "filter-toggle", "aria-label": "Filterbereich anzeigen/ausblenden" }, "Filter");
    toggle.onclick = toggleFilterPane;
    ribbon.append(toggle);
  }
  document.body.append(ribbon);

  // Navigation: the report's pages pane, or an App's own navigation.
  const nav = el("div", { class: "nav" });
  if (app) {
    const list = el("mat-list");
    list.append(el("div", { class: "itemRow", role: "button", "aria-label": "Beispielbericht" }, "Beispielbericht"));
    for (const p of PAGES) {
      const link = el("div", { class: "itemRow", role: "link", "aria-current": p.id === page.id ? "page" : "false" }, p.name);
      list.append(link);
    }
    nav.append(list);
  } else {
    const pane = el("exploration-fluent-navigation");
    const section = el("section", { class: "newLookPageNav", "aria-label": "Berichtsseiten" });
    const list = el("mat-action-list", { role: "tablist", "aria-label": "Seiten" });
    for (const p of PAGES) list.append(el("div", { role: "tab", "aria-selected": String(p.id === page.id) }, p.name));
    section.append(list);
    pane.append(section);
    nav.append(pane);
  }
  document.body.append(nav);

  renderCanvas(page);

  // A tip appears a moment after loading, over the canvas.
  setTimeout(() => {
    const container = el("div", { class: "tutorial-popup-container" });
    const popup = el("div", { class: "tutorial-popup trident no-icon" });
    const box = el("div", { class: "box" }, "Dieses Visual zu PowerPoint hinzufügen");
    const later = el("button", { class: "cancel btn" }, "Vielleicht später");
    later.onclick = () => container.remove();
    box.append(later);
    popup.append(box);
    container.append(popup);
    document.body.append(container);
  }, 300);
}

if (path === "/Redirect" && query.get("action") === "OpenApp") {
  const ctid = query.get("ctid");
  location.replace(`/groups/me/apps/${query.get("appId")}/reports/${REPORT}/${PAGES[0].id}` + (ctid ? `?ctid=${ctid}` : ""));
} else {
  const m = path.match(/^\/groups\/([^/]+)\/(?:apps\/([^/]+)\/)?reports\/([^/]+)\/([^/]+)/);
  if (m) {
    renderReport(m);
  } else if (path.startsWith("/singleSignOn")) {
    document.title = "Anmelden";
    document.body.append(el("h1", {}, "Geben Sie Ihre E-Mail-Adresse ein"));
  } else {
    document.title = "Power BI";
    document.body.append(el("h1", {}, "Start"));
  }
}
</script>
</body>
</html>
